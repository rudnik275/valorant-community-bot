name: Announce

# Post a one-off announcement to the group chat as the bot, e.g. a schedule
# change. Runs scripts/launch/announce.ts inside the running container, which
# reads the bot token from its own env.
#
#   gh workflow run announce.yml --json < inputs.json
#   inputs.json: {"text_b64": "<base64 of the Telegram HTML>", "silent": "1"}

on:
  workflow_dispatch:
    inputs:
      text_b64:
        description: 'Message (Telegram HTML), base64-encoded.'
        required: true
      silent:
        description: 'Set to "1" to post without a notification sound.'
        required: false
        default: ''

jobs:
  announce:
    name: Post an announcement to the group
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          TEXT_B64: ${{ inputs.text_b64 }}
          SILENT: ${{ inputs.silent }}
        run: |
          [[ "$TEXT_B64" =~ ^[A-Za-z0-9+/=]+$ ]] || { echo "text_b64 is not base64"; exit 1; }
          [[ -z "$SILENT" || "$SILENT" == "1" ]] || { echo 'silent must be empty or "1"'; exit 1; }

      # Same deploy key and host as the CI deploy job.
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SSH_PRIVATE_KEY: "op://valorant-community-bot/valorant-deploy-1p/private key?ssh-format=openssh"

      - name: Send from inside the running container
        uses: appleboy/ssh-action@v1
        env:
          ANNOUNCE_B64: ${{ inputs.text_b64 }}
          SILENT: ${{ inputs.silent }}
        with:
          host: 46.62.229.131
          username: deploy
          key: ${{ env.SSH_PRIVATE_KEY }}
          envs: ANNOUNCE_B64,SILENT
          script: |
            docker exec -e ANNOUNCE_B64="$ANNOUNCE_B64" -e SILENT="$SILENT" valorant-bot-app bun run scripts/launch/announce.ts
